# Developer Intelligence Platform — example configuration.
# Copy to config/settings.yaml (gitignored) or set the matching DIP_* env vars.
#
# Note: this is the GLOBAL/host config. Each registered repo stores its own data
# in <repo>/.dip/ (gitignored) and may override sections below via a committed
# <repo>/.devintel.yaml (llm, safety, commands, architecture, orchestrator).

# Default store location (used by the legacy single-DB Container.create path).
storage_dir: ".dip"

# Cross-repo registry: which repositories are known to the platform.
# Override with the DIP_REGISTRY_PATH env var.
registry_path: "~/.dip/registry.json"

llm:
  # OpenAI-compatible local endpoint. Examples:
  #   Ollama        -> http://localhost:11434/v1
  #   LM Studio     -> http://localhost:1234/v1
  #   llama.cpp     -> http://localhost:8080/v1
  base_url: "http://localhost:11434/v1"
  api_key: "not-needed-for-local"
  model: "qwen2.5-coder"
  temperature: 0.1
  max_tokens: 1024
  # Soft budget used by the context compiler (characters, ~4 chars/token).
  context_char_budget: 24000

  # Optional per-role overrides. Unset fields fall back to the base settings
  # above, so omitting this whole block uses one model for everything.
  # roles:
  #   planner:    {model: "gpt-oss", temperature: 0.2}
  #   coder:      {model: "qwen2.5-coder", temperature: 0.1}
  #   reviewer:   {model: "gpt-oss", temperature: 0.1}
  #   debugger:   {model: "gpt-oss", temperature: 0.1}
  #   explainer:  {temperature: 0.0}

# Auto-pilot: which steps run automatically vs. wait for approval.
orchestrator:
  gates: ["plan_approval", "patch_approval"]
  auto_repair: true
  auto_accept_on_pass: true

# Research Scout. Usually set per-repo in <repo>/.devintel.yaml under `research:`.
research:
  direction: ""          # e.g. "improve sample efficiency of residual RL"
  max_proposals: 5
  objective: "balanced"  # balanced | novelty | feasibility | impact
  # Literature grounding via the public OpenAlex API (no key). Off by default to
  # stay offline; needs outbound access to api.openalex.org when enabled, and
  # degrades gracefully (no papers) if the network is restricted.
  literature: false
  literature_mailto: ""  # your email -> OpenAlex "polite pool" (faster, optional)
  literature_max: 5
  literature_expand: true  # expand seed papers via references + citations

# Directories never scanned/indexed (in addition to .gitignore).
default_excludes:
  - ".git"
  - ".venv"
  - "venv"
  - "__pycache__"
  - ".pytest_cache"
  - ".mypy_cache"
  - ".ruff_cache"
  - "build"
  - "dist"
  - "node_modules"
  - "data"
  - "checkpoints"
  - ".dip"
